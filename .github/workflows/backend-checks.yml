name: backend-checks

# Type-checks and tests the backend's read-only blockchain module on PRs that
# touch backend / shared / the contracts deployment record, and on pushes to
# main. No secrets required. Does not touch the EAS APK workflow or mobile.
on:
  pull_request:
    paths:
      - "movenrun/package.json"
      - "movenrun/yarn.lock"
      - "movenrun/.yarnrc.yml"
      - "movenrun/scripts/verify-package-manager.mjs"
      - "movenrun/scripts/check-secrets.mjs"
      - "render.yaml"
      - "movenrun/backend/**"
      - "movenrun/shared/**"
      - "movenrun/contracts/deployments/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "movenrun/package.json"
      - "movenrun/yarn.lock"
      - "movenrun/.yarnrc.yml"
      - "movenrun/scripts/verify-package-manager.mjs"
      - "movenrun/scripts/check-secrets.mjs"
      - "render.yaml"
      - "movenrun/backend/**"
      - "movenrun/shared/**"
      - "movenrun/contracts/deployments/**"
      - ".github/workflows/backend-checks.yml"

# Least privilege: this workflow only checks out, installs, type-checks, and
# tests — it never pushes, comments, or publishes anything.
permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck & test
    runs-on: ubuntu-latest
    # A real PostgreSQL, because the movement session model's most important
    # invariant is enforced by a database constraint: one verification row per
    # (user, client_session_id), holding under concurrency. An in-memory
    # repository that mirrors that constraint only proves the mirror works, so
    # leaving the end-to-end suite to skip in CI would leave the invariant
    # verified nowhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movenrun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The Yarn 4 workspaces project lives in the movenrun/ subdirectory.
    defaults:
      run:
        working-directory: movenrun
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo pins Yarn 4 via package.json "packageManager" (the single
      # source of truth); Corepack provisions the right Yarn version.
      - name: Enable Corepack
        run: corepack enable

      - name: Verify package manager version
        run: node scripts/verify-package-manager.mjs

      # No server secret (Supabase secret or service_role key, private key,
      # provider token) may be committed. Prints the kind and file only.
      - name: Secret scan (tracked files)
        run: node scripts/check-secrets.mjs

      # movenrun/yarn.lock is committed and deterministic.
      - name: Install dependencies (immutable)
        run: yarn install --immutable

      # @movenrun/shared first: it is where the canonical H3 world grid lives,
      # and the backend derives every cell through it. Nothing ran against this
      # package before — it could not even build, so there was nothing to run.
      - name: Type-check @movenrun/shared
        run: yarn workspace @movenrun/shared build

      - name: Test @movenrun/shared
        run: yarn workspace @movenrun/shared test

      - name: Type-check @movenrun/backend
        run: yarn workspace @movenrun/backend typecheck

      - name: Build isolated V3 API
        run: yarn workspace @movenrun/backend build

      # One discovery runner for the whole backend suite (45 files). It walks
      # the tree itself instead of relying on shell globs, which do not recurse
      # under sh. --strict turns any skipped database test into a failure, so a
      # green run here means every database test really executed. It needs the
      # API build above for src/api/runtime.test.ts.
      - name: Test @movenrun/backend (all, with PostgreSQL)
        env:
          MOVENRUN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/movenrun_test
        run: yarn workspace @movenrun/backend test --strict

  # Fast job: no database, no service container. Runs every test file that does
  # not need PostgreSQL; the database set runs in the job above.
  backend-fast:
    name: Backend fast tests (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movenrun
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies (immutable)
        run: yarn install --immutable
      - name: Test @movenrun/shared
        run: yarn workspace @movenrun/shared test
      - name: Test @movenrun/backend (unit category)
        run: yarn workspace @movenrun/backend test:unit
