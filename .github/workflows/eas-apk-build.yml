name: EAS APK Build

# Manually-triggered Android APK build via EAS Build.
# Requires a single GitHub Actions secret: EXPO_TOKEN (an Expo access token).
# No other secrets are used. Produces an installable APK (preview profile).
on:
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (EAS, preview)
    runs-on: ubuntu-latest
    # EXPO_TOKEN (repo Settings -> Secrets and variables -> Actions) is given
    # only to the steps that need it, never to the job: `yarn install` runs
    # third-party install scripts, which must not be able to read it.
    steps:
      - uses: actions/checkout@v4

      # React Native 0.81 / Metro (Expo SDK 54) require Node >= 20.19.4.
      # "20" resolves to the latest 20.x, which satisfies that floor — do not
      # pin a lower 20.x patch here.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The repo pins Yarn 4 via package.json "packageManager"; Corepack
      # provisions the right Yarn version.
      - name: Enable Corepack
        run: corepack enable

      - name: Verify EXPO_TOKEN secret is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is present."

      # Fail fast (before the install/build) if the EAS project isn't linked yet.
      - name: Preflight - ensure EAS projectId is linked
        working-directory: movenrun/mobile
        run: |
          if grep -q "FILL_ME_IN" app.json; then
            echo "::error::EAS projectId is not linked. Run 'eas init' from movenrun/mobile and commit the generated extra.eas.projectId before running this workflow."
            exit 1
          fi
          echo "EAS projectId is linked."

      # Install from the Yarn workspaces root (movenrun/). movenrun/yarn.lock
      # is committed and deterministic.
      - name: Install dependencies (immutable)
        working-directory: movenrun
        run: yarn install --immutable

      # Build the APK from the mobile package (where app.json + eas.json live).
      # `eas build` submits to EAS Build and prints the build details URL.
      - name: Build Android APK (EAS preview profile)
        working-directory: movenrun/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # A pinned CLI: `@latest` would run whatever was published last with
        # the Expo token in its environment. Update the pin deliberately.
        run: npx --yes eas-cli@24.8.0 build -p android --profile preview --non-interactive
