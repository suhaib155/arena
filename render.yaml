# Staging API on Render's free instance, database on the Supabase Free project
# (see movenrun/docs/play-launch/HOSTING_SUPABASE_FREE.md). No automatic deploy.
# Free instances have no pre-deploy step, so migrations run before start; the
# migration command is idempotent.
services:
  - type: web
    name: movenrun-staging-api
    runtime: node
    plan: free
    region: virginia
    branch: release/android-v1-cxfdbd
    rootDir: movenrun
    autoDeployTrigger: off
    numInstances: 1
    buildCommand: corepack enable && yarn install --immutable && yarn workspace @movenrun/backend build
    startCommand: yarn workspace @movenrun/backend db:migrate && yarn workspace @movenrun/backend start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Supabase session pooler string with sslmode=verify-full and
      # sslrootcert=/etc/secrets/supabase-ca.crt. Set in the dashboard, never here.
      - key: DATABASE_URL
        sync: false
      - key: IDENTITY_SESSION_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: https://movenrun.xyz
      # Sign-in: Supabase Auth (Google and wallet). Set in the dashboard, never here.
      - key: SUPABASE_URL
        value: https://tavxmwuwkeynbnzfwove.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: IDENTITY_AUTH_DOMAIN
        value: movenrun.xyz
      - key: TRUST_PROXY_HOPS
        value: "1"
