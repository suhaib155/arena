<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img" aria-labelledby="holddecay-t holddecay-d">
<title id="holddecay-t">How a hold fades while you stay away</title>
<desc id="holddecay-d">A line chart over fourteen days. Defense starts at forty percent and falls to zero after about three days. Control holds at one hundred percent until defense reaches zero, then falls more slowly, reaching about thirty five percent at fourteen days.</desc>
<rect width="360" height="370" rx="18" fill="#F8FAF7"/>
<text x="24" y="34" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#111827">How a hold fades</text>
<path d="M 52 240.0 L 336 240.0" fill="none" stroke="#E6EAEF" stroke-width="1"/>
<text x="44" y="244.0" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">0</text>
<path d="M 52 170.0 L 336 170.0" fill="none" stroke="#E6EAEF" stroke-width="1"/>
<text x="44" y="174.0" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">50</text>
<path d="M 52 100.0 L 336 100.0" fill="none" stroke="#E6EAEF" stroke-width="1"/>
<text x="44" y="104.0" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">100</text>
<text x="52.0" y="260" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">0</text>
<text x="194.0" y="260" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">7</text>
<text x="336.0" y="260" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">14</text>
<path d="M 52 240 L 336 240" fill="none" stroke="#D0D5DD" stroke-width="1.5"/>
<text x="194.0" y="280" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">days since your last visit</text>
<text x="44" y="86" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">%</text>
<path d="M 52.0 184.0 L 119.61904761904762 240.0 L 336.0 240.0" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 52.0 100.0 L 119.61904761904762 100.0 L 336.0 191.0" fill="none" stroke="#246BFE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 25 302 L 43 302" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round"/>
<text x="50" y="306" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Defense</text>
<path d="M 193 302 L 211 302" fill="none" stroke="#246BFE" stroke-width="2.5" stroke-linecap="round"/>
<text x="218" y="306" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Control</text>
<text x="24" y="338" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Visiting the cell resets both.</text>
</svg>
