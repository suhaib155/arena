<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="roadmap-t roadmap-d">
<title id="roadmap-t">What is built and what is next</title>
<desc id="roadmap-d">Four phases in order. The movement game is built. Clubs syncing between players, Points, and deeds on Base are planned and not built.</desc>
<rect width="360" height="440" rx="18" fill="#F8FAF7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3AAB8"/></marker></defs>
<text x="24" y="34" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#111827">What is built, and what is next</text>
<rect x="74" y="66" width="212" height="54" rx="12" fill="#E2F8EF" stroke="#18C987" stroke-width="2"/>
<text x="180.0" y="91.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">The movement game</text>
<text x="180.0" y="109.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">sessions, capture, holding</text>
<text x="62" y="98" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#667085">1</text>
<path d="M 180.0 123 L 180.0 142" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="148" width="212" height="54" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
<text x="180.0" y="173.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Clubs and city play</text>
<text x="180.0" y="191.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">clubs sync between players</text>
<text x="62" y="180" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#667085">2</text>
<path d="M 180.0 205 L 180.0 224" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="230" width="212" height="54" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
<text x="180.0" y="255.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Points</text>
<text x="180.0" y="273.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">the in-game currency</text>
<text x="62" y="262" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#667085">3</text>
<path d="M 180.0 287 L 180.0 306" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="312" width="212" height="54" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
<text x="180.0" y="337.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Deeds on Base</text>
<text x="180.0" y="355.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">a record of what you hold</text>
<text x="62" y="344" text-anchor="end" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#667085">4</text>
<polygon points="34,381 40.06,384.5 40.06,391.5 34,395 27.94,391.5 27.94,384.5" fill="#E2F8EF" stroke="#18C987" stroke-width="1.8"/>
<text x="50" y="392" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Built</text>
<polygon points="202,381 208.06,384.5 208.06,391.5 202,395 195.94,391.5 195.94,384.5" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.8"/>
<text x="218" y="392" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Planned</text>
<text x="24" y="424" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Order matters more than dates here.</text>
</svg>
