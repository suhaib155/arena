<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" role="img" aria-labelledby="lifecycle-t lifecycle-d">
<title id="lifecycle-t">The life of a cell</title>
<desc id="lifecycle-d">A held cell moves through at risk, contested and dormant as it is left alone. Visiting the cell at any of those stages returns it to held.</desc>
<rect width="360" height="454" rx="18" fill="#F8FAF7"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3AAB8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#18C987"/></marker></defs>
<text x="24" y="34" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#111827">The life of a cell</text>
<rect x="74" y="66" width="212" height="52" rx="12" fill="#E2F8EF" stroke="#18C987" stroke-width="2"/>
<text x="180.0" y="90.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Held</text>
<text x="180.0" y="108.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">defense full</text>
<path d="M 180.0 121 L 180.0 140" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="146" width="212" height="52" rx="12" fill="#FFF9EE" stroke="#F7B955" stroke-width="2"/>
<text x="180.0" y="170.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">At risk</text>
<text x="180.0" y="188.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">defense running down</text>
<path d="M 180.0 201 L 180.0 220" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="226" width="212" height="52" rx="12" fill="#FDECEC" stroke="#FF6B4A" stroke-width="2"/>
<text x="180.0" y="250.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Contested</text>
<text x="180.0" y="268.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">defense gone, hold fading</text>
<path d="M 180.0 281 L 180.0 300" fill="none" stroke="#A3AAB8" stroke-width="2" marker-end="url(#a)"/>
<rect x="74" y="306" width="212" height="52" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
<text x="180.0" y="330.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Dormant</text>
<text x="180.0" y="348.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#667085">dropped off your map</text>
<path d="M 292 338 C 330 338 330 96 292 92" fill="none" stroke="#18C987" stroke-width="2" marker-end="url(#a)"/>
<text x="344" y="227.0" text-anchor="middle" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0A8F60">visit</text>
<path d="M30.2 375.4 L38.5 374.8 Q40.4 374.6 40.3 376.6 L40 383 Q39.9 385 37.9 385 L29.1 384.9 Q27.1 384.9 27.3 383 L28 377.5 Q28.3 375.6 30.2 375.4Z" fill="#E2F8EF" stroke="#18C987" stroke-width="1.8"/>
<text x="50" y="384" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Held</text>
<path d="M198.4 374.3 L206.9 374.7 Q208.8 374.8 208.6 376.8 L207.9 384.2 Q207.7 386.2 205.8 385.9 L198.6 384.8 Q196.6 384.5 196.6 382.6 L196.5 376.2 Q196.5 374.2 198.4 374.3Z" fill="#FFF9EE" stroke="#F7B955" stroke-width="1.8"/>
<text x="218" y="384" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">At risk</text>
<path d="M30.9 398.8 L37.6 398.6 Q39.6 398.5 39.6 400.5 L39.6 407.5 Q39.7 409.4 37.7 409.5 L29.5 409.7 Q27.5 409.8 27.8 407.8 L28.7 400.8 Q28.9 398.8 30.9 398.8Z" fill="#FDECEC" stroke="#FF6B4A" stroke-width="1.8"/>
<text x="50" y="408" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Contested</text>
<path d="M198.3 399.3 L206.1 398.2 Q208.1 397.9 207.9 399.8 L207.2 406.9 Q207 408.8 205.1 408.9 L198.2 409.2 Q196.3 409.3 196.3 407.3 L196.3 401.6 Q196.4 399.6 198.3 399.3Z" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="1.8"/>
<text x="218" y="408" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Dormant</text>
<text x="24" y="434" font-family="Sora, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#667085">Only time away moves a cell down this list.</text>
</svg>
