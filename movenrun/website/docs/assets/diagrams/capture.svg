<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" role="img" aria-labelledby="capture-t capture-d">
<title id="capture-t">How a session claims one new cell</title>
<desc id="capture-d">A route touches three cells: one already held and two not. Saving the session claims only the first cell that was not already held. The held cell on the route has its hold refreshed, shown by a ring, and the second unheld cell stays unclaimed.</desc>
